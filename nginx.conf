server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Repli SPA : toute route inconnue (ex. /admin/devis rechargée en direct)
    # doit retomber sur index.html pour que React Router prenne le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les images/fonts changent de nom à chaque build (hash Vite) : cache long.
    location ~* \.(?:jpg|jpeg|png|svg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Relais vers l'API — utile si le reverse proxy principal ne le fait pas
    # déjà lui-même (voir docker-compose.prod.yml pour le schéma retenu).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

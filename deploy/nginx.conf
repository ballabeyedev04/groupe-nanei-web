# ============================================================
#  Groupe Nanei — site web + back-office (fichiers statiques du CI)
#  Le CI (.github/workflows/deploy.yml) copie dist/ dans
#  /var/www/groupe-nanei-web ; l'application est construite pour être
#  servie sous /groupe-nanei/ (base Vite). Les deux domaines servent le
#  même build, seule la page d'arrivée change :
#    site.groupe-nanei.com  → /groupe-nanei/            (vitrine)
#    admin.groupe-nanei.com → /groupe-nanei/admin/login (back-office)
#
#  Déposer dans : /etc/nginx/sites-available/groupe-nanei-web
#  Activer via  : ln -sf /etc/nginx/sites-available/groupe-nanei-web \
#                        /etc/nginx/sites-enabled/groupe-nanei-web
#  HTTPS        : certbot --nginx -d site.groupe-nanei.com -d admin.groupe-nanei.com
#                 (Certbot ajoute lui-même les blocs 443 et la redirection)
# ============================================================

map $host $groupe_nanei_accueil {
    admin.groupe-nanei.com  /groupe-nanei/admin/login;
    default                 /groupe-nanei/;
}

server {
    listen 80;
    listen [::]:80;
    server_name site.groupe-nanei.com admin.groupe-nanei.com;

    root /var/www/groupe-nanei-web;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # La racine du domaine renvoie vers la page d'arrivée (vitrine ou admin).
    location = / {
        return 302 $groupe_nanei_accueil;
    }

    location = /groupe-nanei {
        return 301 /groupe-nanei/;
    }

    # Fichiers du build ; repli SPA sur index.html pour que React Router
    # prenne le relais (ex. /groupe-nanei/admin/devis rechargée en direct).
    location /groupe-nanei/ {
        alias /var/www/groupe-nanei-web/;
        try_files $uri $uri/ /groupe-nanei/index.html;
    }

    # Les assets changent de nom à chaque build (hash Vite) : cache long.
    location /groupe-nanei/assets/ {
        alias /var/www/groupe-nanei-web/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache, sinon les visiteurs
    # gardent l'ancienne version après un déploiement.
    location = /groupe-nanei/index.html {
        alias /var/www/groupe-nanei-web/index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/groupe-nanei-web-access.log combined;
    error_log  /var/log/nginx/groupe-nanei-web-error.log warn;
}

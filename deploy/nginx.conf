# ============================================================
#  Groupe Nanei — site web (fichiers statiques déposés par le CI)
#  Le CI (.github/workflows/deploy.yml) copie dist/ dans
#  /var/www/groupe-nanei-web ; le site est construit pour être servi
#  sous /groupe-nanei/ (base Vite).
#
#  Remplacer : YOUR_DOMAIN par votre vrai domaine (ex: groupe-nanei.fr)
#  Déposer dans : /etc/nginx/sites-available/groupe-nanei-web
#  Activer via  : ln -sf /etc/nginx/sites-available/groupe-nanei-web \
#                        /etc/nginx/sites-enabled/groupe-nanei-web
#  Certificat   : certbot --nginx -d YOUR_DOMAIN
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/groupe-nanei-web;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # La racine du domaine renvoie vers le site.
    location = / {
        return 302 /groupe-nanei/;
    }

    location = /groupe-nanei {
        return 301 /groupe-nanei/;
    }

    # Fichiers du build ; repli SPA sur index.html pour que React Router
    # prenne le relais (ex. /groupe-nanei/admin/devis rechargée en direct).
    location /groupe-nanei/ {
        alias /var/www/groupe-nanei-web/;
        try_files $uri $uri/ /groupe-nanei/index.html;
    }

    # Les assets changent de nom à chaque build (hash Vite) : cache long.
    location /groupe-nanei/assets/ {
        alias /var/www/groupe-nanei-web/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache, sinon les visiteurs
    # gardent l'ancienne version après un déploiement.
    location = /groupe-nanei/index.html {
        alias /var/www/groupe-nanei-web/index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/groupe-nanei-web-access.log combined;
    error_log  /var/log/nginx/groupe-nanei-web-error.log warn;
}

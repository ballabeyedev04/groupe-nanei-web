name: Deploy Web to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un seul déploiement à la fois : un push arrivé pendant un déploiement
# attend la fin du précédent.
concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # VITE_API_URL est figée dans le bundle au build : elle doit pointer
      # vers l'API de production (ex. https://api.groupe-nanei.fr/api/v1).
      - name: Write .env
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env

      - name: Build
        run: npm run build

      # Le site est construit avec base '/groupe-nanei/' (vite.config.js) :
      # le contenu de dist/ est servi par Nginx sous /groupe-nanei/
      # (voir deploy/nginx.conf).
      - name: Deploy dist/ to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/groupe-nanei-web"
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -f -I "${{ secrets.SITE_URL }}/groupe-nanei/" || exit 1
